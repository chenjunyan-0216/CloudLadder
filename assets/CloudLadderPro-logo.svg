<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="CloudLadderPro 应用图标">
  <defs>
    <!-- 品牌蓝色渐变底（深邃感） -->
    <linearGradient id="bg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- 顶部柔光 -->
    <radialGradient id="bg-glow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 梯子渐变（左下亮起，向右上渐变为纯白） -->
    <linearGradient id="ladder-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <!-- 云朵材质（纯白到淡蓝） -->
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- 云朵投影（加强纵深） -->
    <filter id="cloud-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>

    <!-- 梯子柔和发光 -->
    <filter id="ladder-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 底层：圆角蓝色背景 -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg-grad)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#bg-glow)"/>

  <!-- 2. 中层：从左下角通往右上角的梯子（45° 斜向，两根侧轨 + 横档） -->
  <g filter="url(#ladder-glow)" stroke="url(#ladder-grad)" fill="none" stroke-linecap="round">
    <!-- 左侧轨 -->
    <line x1="130.15" y1="724.15" x2="724.15" y2="130.15" stroke-width="52"/>
    <!-- 右侧轨 -->
    <line x1="299.85" y1="893.85" x2="893.85" y2="299.85" stroke-width="52"/>

    <!-- 横档（沿对角线等距排布，穿过云层后方） -->
    <line x1="172.59" y1="681.71" x2="342.29" y2="851.41" stroke-width="34"/>
    <line x1="257.44" y1="596.86" x2="427.14" y2="766.56" stroke-width="34"/>
    <line x1="342.30" y1="512.00" x2="512.00" y2="681.70" stroke-width="34"/>
    <line x1="427.15" y1="427.15" x2="596.85" y2="596.85" stroke-width="34"/>
    <line x1="512.00" y1="342.30" x2="681.70" y2="512.00" stroke-width="34"/>
    <line x1="596.86" y1="257.44" x2="766.56" y2="427.14" stroke-width="34"/>
    <line x1="681.71" y1="172.59" x2="851.41" y2="342.29" stroke-width="34"/>
  </g>

  <!-- 3. 顶层：正中 C 位的云朵 -->
  <g filter="url(#cloud-shadow)" fill="url(#cloud-grad)">
    <!-- 左圆 -->
    <circle cx="370" cy="530" r="130"/>
    <!-- 中上主圆 -->
    <circle cx="512" cy="460" r="170"/>
    <!-- 右圆 -->
    <circle cx="654" cy="530" r="130"/>
    <!-- 底部融合矩形 -->
    <rect x="370" y="480" width="284" height="190" rx="95" />
  </g>

  <!-- 细节修饰：云层上方的小星光/节点，增强云原生科技感 -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="512" cy="240" r="8"/>
    <circle cx="450" cy="280" r="4"/>
    <circle cx="580" cy="270" r="5"/>
  </g>
</svg>